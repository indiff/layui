name: Create Release

on:
  # push:
  #   tags:
  #     - 'v*'
  workflow_dispatch:
    

jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          NODE_ENV: development

      - name: Get the version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      # 获取当前版本贡献者
      - name: Fetch Contributors
        id: contributors
        run: |
          USERNAME_LIST=""

          # 获取完整的提交历史
          git fetch --prune --unshallow

          # 按日期排序标签，获取上一个标签
          PREVIOUS_TAG=$(git for-each-ref --sort=-creatordate --format '%(refname:short)' refs/tags | sed -n 2p)

          # 获取当前标签
          CURRENT_TAG=${GITHUB_REF#refs/tags/}

          echo "Previous Tag: $PREVIOUS_TAG"
          echo "Current Tag: $CURRENT_TAG"

          for COMMIT_SHA in $(git log ${PREVIOUS_TAG}...$CURRENT_TAG --pretty=format:"%H")
          do
            USER=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                   https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/$COMMIT_SHA \
                   | jq -r '.author.login')
            if [ "$USER" != "null" ] && [ ! -z "$USER" ]; then
              USERNAME_LIST="$USERNAME_LIST @$USER"
            fi
          done
          USERNAME_LIST=$(echo $USERNAME_LIST | tr ' ' '\n' | sort -u | tr '\n' ' ')
          echo "usernames=$USERNAME_LIST" >> $GITHUB_OUTPUT

      - name: Determine Prerelease
        id: prerelease
        run: |
          if [[ ${{ github.ref }} =~ - ]]; then
            echo "Setting prerelease to true"
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "Setting prerelease to false"
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Zip File
        id: asset
        run: |
          npm run release
          DIR_NAME="release/assets/layui-${{ env.VERSION }}"
          echo "filename=$DIR_NAME" >> $GITHUB_OUTPUT

      # - name: GH Release
      #   id: create_release
      #   uses: softprops/action-gh-release@v3
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   with:
      #     body: |
      #       - **更新日志**: https://layui.dev/docs/3/versions.html#${{ env.VERSION }}
      #       - **本次贡献**: ${{ steps.contributors.outputs.usernames }} 🎉
      #     prerelease: ${{ steps.prerelease.outputs.prerelease }}
      #     files: ${{ steps.asset.outputs.filename }}.zip
      - name: Release
        run: |
          set -xe
          sudo apt-get update
          sudo apt-get install -y zip unzip systemd language-pack-zh-hans language-pack-zh-hans-base locales tree
          sudo locale-gen zh_CN.UTF-8; /usr/bin/localectl set-locale LANG=zh_CN.UTF-8 || true ; 
          /usr/bin/timedatectl set-timezone Asia/Shanghai || true; 
          /usr/bin/timedatectl set-ntp true || true;
          TAG_NAME=$(date +'%Y%m%d_%H%M')_layui
          
          cat <<'EOF' >> hello.md
          - **更新日志**: https://layui.dev/docs/3/versions.html#${{ env.VERSION }}
          - **本次贡献**: ${{ steps.contributors.outputs.usernames }} 🎉
          Proxy download:
          ```bash         
          curl -#Lo /opt/shit.zip "https://ghfast.top/https://github.com/indiff/indiff/releases/download/$TAG_NAME/${{ steps.asset.outputs.filename }}.zip  --insecure"
          ```
          
          Direct download:
          ```bash         
          curl -#Lo /opt/shit.zip "https://github.com/indiff/indiff/releases/download/$TAG_NAME/${{ steps.asset.outputs.filename }}.zip"
          ```
          EOF
  
          gh release create $TAG_NAME -F hello.md release/assets/*.zip
        env:
          GITHUB_TOKEN: ${{ github.token }}
      
